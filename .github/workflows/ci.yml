name: OpenFOAM 13 CI

on:
  push:
    branches:
      - main
      - Development
      - codex/openfoam13-heat-transfer
  pull_request:
    branches:
      - main
      - Development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfoam13-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tutorials:
    name: Build and run OpenFOAM 13 tutorials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENFOAM_MCP_WORK_DIR: ${{ runner.temp }}/openfoam-mcp-ci-work
      OPENFOAM_MCP_TEST_CASE_ROOT: ${{ runner.temp }}/openfoam13-test-cases
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools and OpenFOAM 13
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nlohmann-json3-dev software-properties-common wget ca-certificates
          sudo sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y "http://dl.openfoam.org/ubuntu main"
          sudo apt-get update
          sudo apt-get install -y openfoam13

      - name: Configure and build
        run: |
          source /opt/openfoam13/etc/bashrc
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Run MCP tutorial integration cases
        run: |
          source /opt/openfoam13/etc/bashrc
          python3 tests/integration/test_openfoam13_tutorial_runs.py

      - name: Upload solver logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam13-ci-logs
          path: |
            ${{ runner.temp }}/openfoam-mcp-ci-work
            ${{ github.workspace }}/**/blockMesh.log
            ${{ github.workspace }}/**/checkMesh.log
            ${{ github.workspace }}/**/solver.log
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: Build OpenFOAM 13 container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OpenFOAM 13 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.openfoam13
          push: false
          tags: openfoam-mcp-server:openfoam13-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
